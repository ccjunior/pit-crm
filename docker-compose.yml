services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PITCRM_DB_NAME:-pitcrm_dev}
      POSTGRES_USER: ${PITCRM_DB_USER:-pitcrm}
      POSTGRES_PASSWORD: ${PITCRM_DB_PASSWORD:-pitcrm_local_dev}
    ports:
      - "${PITCRM_DB_PORT:-5433}:5432"
    volumes:
      - pitcrm_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pitcrm_postgres_data:
